
apiVersion: apps/v1
kind: Deployment
metadata:
  name: biotronik-welcome
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: biotronik-welcome
  template:
    metadata:
      labels:
        app: biotronik-welcome
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: biotronik-welcome-html
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: biotronik-welcome-html
  namespace: default
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>Biotronik Welcome</title>
      <style>
        body {
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          margin: 0;
          background-color: #f5f5f5;
          font-family: Arial, sans-serif;
        }
        h1 {
          color: green;
          font-weight: bold;
          font-size: 42px;
        }
      </style>
    </head>
    <body>
      <h1>Welcome to the Biotronik world!</h1>
    </body>
    </html>
---
apiVersion: v1
kind: Service
metadata:
  name: biotronik-welcome
  namespace: default
spec:
  selector:
    app: biotronik-welcome
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP

